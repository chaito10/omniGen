name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Create release zip
        run: |
          mkdir -p release/omnigen-rc-linux
          cp target/release/omnigen release/omnigen-rc-linux/
          cp README.md release/omnigen-rc-linux/
          cp LICENSE release/omnigen-rc-linux/
          cd release && zip -r omnigen-rc-linux.zip omnigen-rc-linux/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnigen-rc-linux
          path: release/omnigen-rc-linux.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Create release zip
        run: |
          mkdir release/omnigen-rc-windows
          Copy-Item target/release/omnigen.exe release/omnigen-rc-windows/
          Copy-Item README.md release/omnigen-rc-windows/
          Copy-Item LICENSE release/omnigen-rc-windows/
          Compress-Archive -Path release/omnigen-rc-windows/* -DestinationPath release/omnigen-rc-windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnigen-rc-windows
          path: release/omnigen-rc-windows.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Create release zip
        run: |
          mkdir -p release/omnigen-rc-macos
          cp target/release/omnigen release/omnigen-rc-macos/
          cp README.md release/omnigen-rc-macos/
          cp LICENSE release/omnigen-rc-macos/
          cd release && zip -r omnigen-rc-macos.zip omnigen-rc-macos/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnigen-rc-macos
          path: release/omnigen-rc-macos.zip

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/omnigen-rc-linux/omnigen-rc-linux.zip
            artifacts/omnigen-rc-windows/omnigen-rc-windows.zip
            artifacts/omnigen-rc-macos/omnigen-rc-macos.zip

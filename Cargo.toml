[package]
name = "omnigen"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.85"
description = "Production-quality, single-executable multimodal AI runtime"
license = "MIT"
repository = "https://github.com/user/OmniGen"
keywords = ["ai", "multimodal", "inference", "candle", "runtime"]
categories = ["command-line-utilities", "science::artificial-intelligence"]

[[bin]]
name = "omnigen"
path = "src/main.rs"

[dependencies]
candle-core = { version = "0.8" }
candle-nn = { version = "0.8" }
candle-transformers = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
sha2 = "0.10"
hex = "0.4"
directories = "6"
anyhow = "1"
thiserror = "2"
petgraph = "0.7"
rayon = "1.10"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
safetensors = "0.4"
memmap2 = "0.9"
rand = "0.8"
image = "0.25"
chrono = "0.4"
walkdir = "2"
flate2 = "1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
